name: Build Windows Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained win-x64)
        run: dotnet publish CtYun/CtYun.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CtYun-win10-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtYun-win10-x64
          path: CtYun-win10-x64.zip

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CtYun-win10-x64.zip
